				<script>
const button = document.getElementById('noButton');
const body = document.body;
const bodyWidth = body.clientWidth;
const bodyHeight = body.clientHeight;

button.addEventListener('click', () => {
  // Generate random coordinates within the body boundaries
  const maxX = bodyWidth - button.offsetWidth;
  const maxY = bodyHeight - button.offsetHeight;
  const newX = Math.floor(Math.random() * maxX);
  const newY = Math.floor(Math.random() * maxY);

  // Apply new coordinates to the button
  button.style.left = newX + 'px';
  button.style.top = newY + 'px';
  button.style.position = 'absolute'; // Ensure absolute positioning for proper movement
});
</script>
